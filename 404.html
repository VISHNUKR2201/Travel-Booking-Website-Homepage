<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Travel Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --brand-primary: #fd4621;
            --brand-primary-hover: #e03613;
            --brand-primary-light: rgba(253, 70, 33, 0.1);
            --brand-dark: #0f172a;
            --brand-text: #1e293b;
            --brand-muted: #64748b;
            --brand-border: #e2e8f0;
            --brand-bg: #f8fafc;
            --brand-card-bg: rgba(255, 255, 255, 0.85);
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--brand-bg);
            color: var(--brand-text);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Animated Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: floatBlob 16s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(253, 70, 33, 0.4) 0%, rgba(253, 70, 33, 0) 70%);
            top: -100px;
            right: -80px;
            animation-duration: 14s;
        }

        .blob-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            bottom: -120px;
            left: -100px;
            animation-duration: 18s;
        }

        .blob-3 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 179, 71, 0.3) 0%, rgba(255, 179, 71, 0) 70%);
            top: 45%;
            left: 55%;
            transform: translate(-50%, -50%);
            animation-duration: 20s;
        }

        @keyframes floatBlob {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(30px, 40px) scale(1.08);
            }
            100% {
                transform: translate(-20px, -20px) scale(0.95);
            }
        }

        /* Minimal Header with Logo */
        .page-header {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .brand-logo-link {
            display: inline-block;
            transition: transform 0.25s ease;
            text-decoration: none;
        }

        .brand-logo-link:hover {
            transform: scale(1.03);
        }

        .brand-logo {
            max-height: 40px;
            width: auto;
            display: block;
        }

        /* Main Content Container */
        .error-main {
            position: relative;
            z-index: 5;
            flex: 1 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 24px 60px;
        }

        .error-card {
            max-width: 680px;
            width: 100%;
            background: var(--brand-card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
            padding: 56px 44px;
            text-align: center;
            box-shadow: 0 20px 60px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(226, 232, 240, 0.6);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(28px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Error Badge */
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 18px;
            background: var(--brand-primary-light);
            border: 1px solid rgba(253, 70, 33, 0.2);
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--brand-primary);
            box-shadow: 0 0 0 0 rgba(253, 70, 33, 0.7);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(253, 70, 33, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(253, 70, 33, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(253, 70, 33, 0);
            }
        }

        /* 404 Graphic Display */
        .error-num-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(6.5rem, 16vw, 11rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -4px;
            color: var(--brand-dark);
            margin-bottom: 20px;
            user-select: none;
        }

        .digit-four {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
        }

        /* Middle "0" Travel Compass / Globe */
        .globe-zero {
            position: relative;
            width: clamp(80px, 14vw, 130px);
            height: clamp(80px, 14vw, 130px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff2ee 0%, #ffe0d8 100%);
            border: 3px dashed var(--brand-primary);
            box-shadow: 0 12px 30px rgba(253, 70, 33, 0.22);
            animation: rotateCompass 30s linear infinite;
        }

        .globe-inner-ring {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 2px solid rgba(253, 70, 33, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .compass-needle {
            width: 50%;
            height: 50%;
            color: var(--brand-primary);
            animation: needleHover 3s ease-in-out infinite alternate;
        }

        @keyframes rotateCompass {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes needleHover {
            0% {
                transform: rotate(-15deg);
            }
            100% {
                transform: rotate(25deg);
            }
        }

        /* Floating Airplane along dashed path */
        .flight-path {
            position: absolute;
            top: -24px;
            right: 15%;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: airplaneFloat 4s ease-in-out infinite alternate;
        }

        .airplane-icon {
            width: 32px;
            height: 32px;
            color: var(--brand-primary);
            transform: rotate(45deg);
            filter: drop-shadow(0 4px 8px rgba(253, 70, 33, 0.3));
        }

        @keyframes airplaneFloat {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        /* Typography */
        .error-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.6rem, 3.5vw, 2.3rem);
            font-weight: 800;
            color: var(--brand-dark);
            margin-bottom: 14px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .error-desc {
            font-size: clamp(0.95rem, 1.8vw, 1.12rem);
            color: var(--brand-muted);
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 36px;
        }

        /* Action Buttons */
        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            border: none;
            min-width: 170px;
        }

        /* Secondary: Go Back Button */
        .btn-go-back {
            background: #ffffff;
            color: var(--brand-dark);
            border: 1.5px solid var(--brand-border);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .btn-go-back:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
            color: #000000;
        }

        .btn-go-back:active {
            transform: translateY(0);
        }

        /* Primary: Back to Home Button */
        .btn-home {
            background: linear-gradient(135deg, #fd4621 0%, #e03613 100%);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(253, 70, 33, 0.35);
        }

        .btn-home:hover {
            background: linear-gradient(135deg, #ff5733 0%, #fd4621 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(253, 70, 33, 0.45);
            color: #ffffff;
        }

        .btn-home:active {
            transform: translateY(0);
        }

        .btn svg {
            transition: transform 0.2s ease;
        }

        .btn-go-back:hover svg {
            transform: translateX(-4px);
        }

        .btn-home:hover svg {
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .page-header {
                padding: 18px 20px;
                justify-content: center;
            }

            .error-main {
                padding: 10px 16px 40px;
            }

            .error-card {
                padding: 38px 22px;
                border-radius: 24px;
            }

            .error-actions {
                flex-direction: column-reverse;
                width: 100%;
                gap: 12px;
            }

            .btn {
                width: 100%;
            }

            .flight-path {
                right: 8%;
                top: -20px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Visual Glow Background -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="ambient-blob blob-3"></div>
    </div>

    <!-- Minimal Header with Brand Logo -->
    <header class="page-header">
        <a href="html/index.html" class="brand-logo-link" title="Stackly Travel Agency">
            <img src="images/logo-black.webp" alt="Stackly Travel Agency" class="brand-logo">
        </a>
    </header>

    <!-- Main 404 Content -->
    <main class="error-main">
        <div class="error-card">
            
            <!-- Category Badge -->
            <div class="error-badge">
                <span class="pulse-dot"></span>
                <span>Error 404 • Destination Lost</span>
            </div>

            <!-- Stylized 404 Display -->
            <div class="error-num-wrapper">
                <span class="digit-four">4</span>
                <div class="globe-zero" title="Coordinates not found">
                    <div class="globe-inner-ring">
                        <!-- Compass Needle SVG -->
                        <svg class="compass-needle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 19 21 12 17 5 21 12 2"/>
                        </svg>
                    </div>
                </div>
                <span class="digit-four">4</span>

                <!-- Floating Airplane -->
                <div class="flight-path">
                    <svg class="airplane-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                </div>
            </div>

            <!-- Heading & Context Description -->
            <h1 class="error-title">Oops! You've Veered Off the Map</h1>
            <p class="error-desc">
                The destination you are trying to reach has moved, departed, or doesn't exist in our itinerary. Let's get your journey back on schedule!
            </p>

            <!-- Action Buttons: Go Back & Back to Home -->
            <div class="error-actions">
                <button type="button" class="btn btn-go-back" onclick="handleGoBack()" aria-label="Go to previous page">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Go Back</span>
                </button>

                <a href="html/index.html" class="btn btn-home" aria-label="Return to homepage">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Back to Home</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Client Script for Go Back Handling (Exact Scroll Position Restoration) -->
    <script>
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                var fromScroll = params.get("fromScroll");
                if (fromScroll) {
                    sessionStorage.setItem("stackly_404_scroll", fromScroll);
                }
            } catch(e) {}
        })();

        function handleGoBack() {
            var savedScroll = "";
            try {
                var params = new URLSearchParams(window.location.search);
                savedScroll = params.get("fromScroll") || sessionStorage.getItem("stackly_404_scroll") || "";
            } catch(e) {}

            var targetUrl = "html/index.html" + (savedScroll ? "?scroll=" + savedScroll : "");
            window.location.replace(targetUrl);
        }
    </script>
</body>
</html>
